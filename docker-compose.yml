name: hw04-chweather
services:
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: student
      POSTGRES_PASSWORD: local_homework_only
      TZ: UTC
    command: [postgres, -c, timezone=UTC, -c, shared_buffers=256MB, -c, work_mem=32MB, -c, max_parallel_workers_per_gather=2, -c, max_parallel_workers=2, -c, track_io_timing=on]
    cpus: 2
    mem_limit: 2g
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U student -d weather]
      interval: 3s
      timeout: 3s
      retries: 40
  clickhouse:
    image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    environment:
      CLICKHOUSE_DB: weather
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: local_homework_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    cpus: 2
    mem_limit: 2g
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./docker/clickhouse.xml:/etc/clickhouse-server/config.d/homework.xml:ro
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user student --password local_homework_only --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
  runner:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    cpus: 1
    mem_limit: 1g
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PGHOST: postgres
      PGDATABASE: weather
      PGUSER: student
      PGPASSWORD: local_homework_only
      CH_URL: http://clickhouse:8123
      CH_USER: student
      CH_PASSWORD: local_homework_only
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    command: [python, scripts/run.py]
volumes:
  pg_data:
  ch_data:
